services:
  backend:
    build: .
    container_name: chaiaurbackend

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      MONGODB_URI: mongodb://mongodb:27017/chaiaurbackend

    depends_on:
      - mongodb

    command: npm run dev

  mongodb:
    image: mongo:8
    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
